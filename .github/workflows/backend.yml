name: Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: licoreria
          POSTGRES_USER: licoreria
          POSTGRES_PASSWORD: licoreria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licoreria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenAPI tools
        run: npm install --prefix scripts/openapi --no-audit --no-fund

      - name: Verify OpenAPI contract parity
        run: node scripts/openapi/verificar-paridad.mjs

      - name: Restore
        run: dotnet restore backend/Licoreria.slnx

      - name: Build
        run: dotnet build backend/Licoreria.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Licoreria.slnx --no-build --configuration Release --verbosity normal
