name: Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Licoreria.slnx

      - name: Build
        run: dotnet build backend/Licoreria.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Licoreria.slnx --no-build --configuration Release --verbosity normal
