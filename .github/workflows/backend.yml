name: Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'scripts/coverage/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/coverage/**'
      - '.config/dotnet-tools.json'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: licoreria
          POSTGRES_USER: licoreria
          POSTGRES_PASSWORD: licoreria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licoreria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenAPI tools
        run: npm install --prefix scripts/openapi --no-audit --no-fund

      - name: Verify OpenAPI contract parity
        run: node scripts/openapi/verificar-paridad.mjs

      - name: Restore
        run: dotnet restore backend/Licoreria.slnx

      - name: Build
        run: dotnet build backend/Licoreria.slnx --no-restore --configuration Release

      - name: Unit tests with coverage
        run: >-
          dotnet test backend/tests/Licoreria.UnitTests
          --no-build --configuration Release
          --settings backend/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/raw

      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:artifacts/coverage/raw/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage/report" \
            "-reporttypes:Html;JsonSummary;TextSummary;MarkdownSummaryGithub"
          cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/report
          if-no-files-found: ignore

      - name: Check coverage threshold
        shell: bash
        run: |
          node --test scripts/coverage/verificar-umbral.test.mjs
          node scripts/coverage/verificar-umbral.mjs artifacts/coverage/report/Summary.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # La base de datos es obligatoria en CI: si PostgreSQL no responde, las pruebas fallan en lugar de omitirse.
      - name: Integration tests
        env:
          LICORERIA_TESTS_REQUIRE_DB: 'true'
        run: >-
          dotnet test backend/tests/Licoreria.IntegrationTests
          --no-build --configuration Release --verbosity normal
