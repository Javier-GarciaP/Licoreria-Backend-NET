services:
  # =========================================================
  # Base de datos principal del sistema (PostgreSQL)
  # =========================================================
  postgres:
    image: postgres:15-alpine
    container_name: licoreria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licoreria}
      POSTGRES_USER: ${POSTGRES_USER:-licoreria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licoreria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licoreria} -d ${POSTGRES_DB:-licoreria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # API REST (.NET 10) — aplica migraciones y seed al arrancar
  # =========================================================
  api:
    build:
      context: ./backend
      dockerfile: src/Licoreria.WebAPI/Dockerfile
    container_name: licoreria-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-licoreria};Username=${POSTGRES_USER:-licoreria};Password=${POSTGRES_PASSWORD:-licoreria}
      Jwt__Key: ${JWT_KEY:-licoreria-dev-secret-key-change-in-production-0123456789}
      Jwt__Issuer: ${JWT_ISSUER:-LicoreriaAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-LicoreriaClientes}
      Cors__AllowedOrigins__0: http://localhost:${ADMIN_PORT:-4173}
      Cors__AllowedOrigins__1: http://localhost:${PUBLIC_PORT:-4174}
      Cors__AllowedOrigins__2: http://localhost:${EDGE_PORT:-8090}
      Cors__AllowedOrigins__3: http://localhost:5173
    ports:
      - "${API_PORT:-5190}:8080"

  # =========================================================
  # Panel interno (SPA) servido por nginx
  # =========================================================
  admin:
    build:
      context: ./frontend
      dockerfile: apps/admin/Dockerfile
    container_name: licoreria-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-4173}:80"

  # =========================================================
  # Web pública (SPA) servida por nginx
  # =========================================================
  public-web:
    build:
      context: ./frontend
      dockerfile: apps/public-web/Dockerfile
    container_name: licoreria-public-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-4174}:80"

  # =========================================================
  # Reverse proxy / borde (API + hubs + web pública)
  # =========================================================
  edge:
    image: nginx:alpine
    container_name: licoreria-edge
    restart: unless-stopped
    depends_on:
      - api
      - public-web
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${EDGE_PORT:-8090}:80"

  # =========================================================
  # Cliente web opcional para administrar la base de datos
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: licoreria-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@licoreria.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  postgres_data:
