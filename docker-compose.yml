services:
  # =========================================================
  # Base de datos principal del sistema (PostgreSQL)
  # =========================================================
  db:
    image: postgres:15-alpine
    container_name: licoreria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licoreria}
      POSTGRES_USER: ${POSTGRES_USER:-licoreria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licoreria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licoreria} -d ${POSTGRES_DB:-licoreria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # API REST (.NET 10) — aplica migraciones y seed al arrancar
  # =========================================================
  api:
    build:
      context: ./backend
      dockerfile: src/Licoreria.WebAPI/Dockerfile
    container_name: licoreria-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-licoreria};Username=${POSTGRES_USER:-licoreria};Password=${POSTGRES_PASSWORD:-licoreria}
      Jwt__Key: ${JWT_KEY:-licoreria-dev-secret-key-change-in-production-0123456789}
      Jwt__Issuer: ${JWT_ISSUER:-LicoreriaAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-LicoreriaClientes}
      Fidelidad__PuntosPorUSD: ${FIDELIDAD_PUNTOS_POR_USD:-1}
      Credito__DiasVencimiento: ${CREDITO_DIAS_VENCIMIENTO:-30}
      Cors__AllowedOrigins__0: http://localhost:${ADMIN_PORT:-4173}
      Cors__AllowedOrigins__1: http://localhost:${PUBLIC_PORT:-4174}
      Cors__AllowedOrigins__2: http://localhost:${EDGE_PORT:-8090}
      Cors__AllowedOrigins__3: http://localhost:5173
      Cors__AllowedOrigins__4: http://localhost:5175
      Cors__AllowedOrigins__6: http://localhost:${SPA_PORT:-8080}
      Cors__AllowedOrigins__5: http://localhost:${SERVICIO_PORT:-4175}
      # Swagger UI accesible también fuera de Development (despliegue local).
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================
  # Panel interno (SPA React) servido por nginx — http://localhost:8080
  # =========================================================
  spa:
    build:
      context: ./frontend
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-5000}
        VITE_HUB_URL: http://localhost:${API_PORT:-5000}/hubs/comandas
    container_name: licoreria-spa
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SPA_PORT:-8080}:80"

  # =========================================================
  # Web pública (SPA) servida por nginx
  # =========================================================
  public-web:
    build:
      context: ./frontend
      dockerfile: apps/public-web/Dockerfile
    container_name: licoreria-public-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-4174}:80"

  # =========================================================
  # Web de servicio (mesonero / KDS) servida por nginx
  # =========================================================
  servicio:
    build:
      context: ./frontend
      dockerfile: apps/servicio/Dockerfile
    container_name: licoreria-servicio
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SERVICIO_PORT:-4175}:80"

  # =========================================================
  # Reverse proxy / borde (API + hubs + web pública)
  # =========================================================
  edge:
    image: nginx:alpine
    container_name: licoreria-edge
    restart: unless-stopped
    depends_on:
      - api
      - public-web
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${EDGE_PORT:-8090}:80"

  # =========================================================
  # Cliente web opcional para administrar la base de datos
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: licoreria-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@licoreria.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  postgres_data:

